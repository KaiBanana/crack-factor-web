<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="输入合金成分，预测凝固区间及五项裂纹相关因子。"><title>合金裂纹因子预测</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <section class="intro"><p class="eyebrow">热力学计算</p><h1>合金裂纹因子预测</h1><p>输入合金成分，预测六项因子。</p></section>
  <div class="workspace">
    <section class="panel"><div class="section-head"><h2>合金成分 <small id="unit"></small></h2><button id="example" type="button" class="text-button" disabled>填入示例（IN625）</button></div>
      <form id="form"><div id="inputs" class="inputs"></div><p id="composition-note" class="note"></p><div class="form-bottom"><span id="total">总含量 —</span><button id="submit" type="submit" disabled>加载中…</button></div></form>
      <p id="error" class="error" role="alert"></p>
    </section>
    <section class="panel output" id="output" aria-busy="false"><div class="section-head"><h2>预测结果</h2><span id="state" role="status" aria-live="polite">等待输入</span></div><div id="loading" class="loading" hidden><span class="spinner" aria-hidden="true"></span><span>正在计算…</span></div><div id="results" class="results"></div><p id="warning" class="warning" role="status"></p></section>
  </div>
</main><script type="module" src="app.mjs"></script>
</body></html>
